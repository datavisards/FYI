<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>FYI Options</title>
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; max-width: 480px; }
      label { display: block; margin-bottom: 4px; font-weight: 500; }
      input { width: 100%; padding: 8px; margin-bottom: 12px; box-sizing: border-box; }
      button { padding: 8px 16px; cursor: pointer; }
      .saved { color: green; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>FYI Options</h1>
    <label for="apiBaseUrl">API base URL (leave blank for auto: tries localhost:3000, then Render)</label>
    <input type="url" id="apiBaseUrl" placeholder="Auto (localhost → fyi-hyaj.onrender.com)" />
    <button id="save">Save</button>
    <p id="status" class="saved" style="display: none;">Saved.</p>
    <script src="options.js"></script>
  </body>
</html>
