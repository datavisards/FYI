services:
  - type: web
    name: fyi
    env: node
    buildCommand: npm install && npx next build
    startCommand: npx next start -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_ENDPOINT
        sync: false
      - key: NEXT_PUBLIC_APPWRITE_PROJECT_ID
        sync: false
      - key: APPWRITE_API_KEY
        sync: false

  - type: web
    name: news
    runtime: static
    plan: free
    rootDir: news
    staticPublishPath: news
